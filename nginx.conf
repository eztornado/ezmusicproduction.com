# Config de nginx para la SPA de EZMusicProduction.
# Se copia a /etc/nginx/conf.d/default.conf dentro de la imagen.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Health check para Coolify / Docker -------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Assets con hash: caché de un año --------------------------------
    # (solo `expires`, sin `add_header`, para no romper la herencia de las
    #  cabeceras de seguridad definidas más abajo)
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # --- Imágenes, vídeo y fuentes de public/ ----------------------------
    location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico|mp4|webm|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    # --- App shell: siempre revalidar ------------------------------------
    location = /index.html {
        expires -1;
    }

    # --- SPA fallback: cualquier ruta sirve index.html --------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Compresión ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # --- Cabeceras de seguridad (heredadas por todas las locations) ------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No revelar la versión de nginx
    server_tokens off;
}
